[package]
name = "psmux"
version = "3.4.0-ohboy"
edition = "2021"
description = "Terminal multiplexer for Windows - tmux alternative for PowerShell and Windows Terminal"
license = "MIT"
repository = "https://github.com/psmux/psmux"
readme = "README.md"
keywords = ["terminal", "multiplexer", "tmux", "windows", "powershell"]
categories = ["command-line-utilities"]

[workspace]
members = [".", "crates/portable-pty-psmux", "crates/vt100-psmux"]
exclude = [
    "target/",
    "release/",
    "tests/",
    "tests-rs/",
    "packages/",
    "psmux-windows-x86_64/",
    ".github/",
    "scripts/",
    "scoop/",
    "examples/",
    "*.txt",
]

# Disable auto-discovery of integration tests from tests/ directory
[[test]]
name = "test_vt100_mouse"
path = "tests-rs/test_vt100_mouse.rs"

[[test]]
name = "test_boundary_contracts"
path = "tests-rs/test_boundary_contracts.rs"

[[test]]
name = "test_feature_contracts"
path = "tests-rs/test_feature_contracts.rs"

[[test]]
name = "memory_leak_detector"
path = "tests-rs/memory_leak_detector.rs"

[[test]]
name = "cpu_runoff_detector"
path = "tests-rs/cpu_runoff_detector.rs"

[[test]]
name = "test_pi_integration_contracts"
path = "tests-rs/test_pi_integration_contracts.rs"

[[test]]
name = "test_backend_rpc_contracts"
path = "tests-rs/test_backend_rpc_contracts.rs"

[[test]]
name = "test_mycel_topics"
path = "tests-rs/test_mycel_topics.rs"
required-features = ["mycel"]

[[test]]
name = "test_wait_for_contracts"
path = "tests-rs/test_wait_for_contracts.rs"

[[test]]
name = "test_orchestrate_contracts"
path = "tests-rs/test_orchestrate_contracts.rs"

[[test]]
name = "test_rails_smoke"
path = "tests-rs/test_rails_smoke.rs"

[[test]]
name = "test_cc_emit_lifecycle_singleton"
path = "tests-rs/test_cc_emit_lifecycle_singleton.rs"

# Embeds the application icon and the VS_VERSIONINFO block into the .exe
# (issue #620). Windows hosts only: this is what build.rs's #[cfg(windows)]
# arm links against. default-features would pull in a whole toml stack purely
# to read `[package.metadata.winresource]`, which build.rs does not use because
# it sets every field explicitly.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "=0.1.31", default-features = false }

# Windows only
[target.'cfg(not(windows))'.dependencies]
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
] }

[[bin]]
name = "psmux"
path = "src/main.rs"

[[bin]]
name = "pmux"
path = "src/main.rs"

[[bin]]
name = "tmux"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
portable-pty = { version = "0.9.2", path = "crates/portable-pty-psmux", package = "portable-pty-psmux" }
which = "8"
chrono = "0.4"
vt100 = { version = "0.16.4", path = "crates/vt100-psmux", package = "vt100-psmux" }
unicode-width = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
glob = "0.3"
base64 = "0.22"
prost = "0.13.5"

# Optional: spike — interprocess crate as named-pipe abstraction
# (replaces hand-rolled Win32 named-pipe code in src/backend/pipe.rs).
# Behind `interprocess-pipe` feature; default OFF.
interprocess = { version = "1.2", optional = true }

[features]
default = ["mycel"]
# Publish lifecycle events on the in-tree mycel bus (src/bus).
mycel = []
interprocess-pipe = ["dep:interprocess"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
