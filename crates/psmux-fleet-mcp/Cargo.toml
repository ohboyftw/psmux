[package]
name = "psmux-fleet-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Stdio JSON-RPC MCP server exposing psmux-fleet primitives"
repository = "https://github.com/psmux/psmux"
readme = "README.md"
keywords = ["psmux", "mcp", "fleet", "jsonrpc"]
categories = ["command-line-utilities"]

[[bin]]
name = "psmux-fleet-mcp"
path = "src/main.rs"

[lib]
name = "psmux_fleet_mcp"
path = "src/lib.rs"

[dependencies]
psmux-fleet = { path = "../psmux-fleet" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util"] }
dirs = "5"

[dev-dependencies]
tempfile = "3"
