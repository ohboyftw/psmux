name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            label: Windows x64
          - target: i686-pc-windows-msvc
            label: Windows x86
          - target: aarch64-pc-windows-msvc
            label: Windows ARM64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

  boundary-contracts:
    name: Boundary Contract Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Backend contract tests
        run: cargo test --test backend_contracts
      - name: Backend lifecycle tests
        run: cargo test --test backend_lifecycle
      - name: Control mode contract tests
        run: cargo test --test control_mode_contracts
      - name: Passthrough tests
        run: cargo test --test passthrough_tests
      - name: Unit tests
        run: cargo test
