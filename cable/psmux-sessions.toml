[metadata]
name = "psmux-sessions"
description = "Switch between psmux sessions"
requirements = ["psmux"]

[source]
command = "psmux list-sessions"
display = "{}"
output = "{split:\\::0}"
shell = "powershell"

[preview]
command = "psmux list-panes -t '{split:\\::0}'"
shell = "powershell"

[keybindings]
enter = "actions:attach"
ctrl-k = "actions:kill"

[actions.attach]
description = "Attach to session"
command = "psmux attach-session -t '{split:\\::0}'"
mode = "execute"

[actions.kill]
description = "Kill session"
command = "psmux kill-session -t '{split:\\::0}'"
mode = "fork"
