[metadata]
name = "psmux-windows"
description = "Switch between psmux windows"
requirements = ["psmux"]

[source]
command = "psmux list-sessions | ForEach-Object { $s = ($_ -split ':')[0]; psmux list-windows -t $s 2>$null | ForEach-Object { \"$s`t$_\" } } | Where-Object { $_ }"
display = "{split:\t:0} | {split:\t:1}"
output = "{split:\t:0}"
shell = "powershell"

[preview]
command = "psmux list-panes -t '{split:\t:0}'"
shell = "powershell"

[keybindings]
enter = "actions:select"
ctrl-k = "actions:kill"

[actions.select]
description = "Select window"
command = "psmux select-window -t '{split:\t:0}'"
mode = "execute"

[actions.kill]
description = "Kill window"
command = "psmux kill-window -t '{split:\t:0}'"
mode = "fork"
